<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regalería Violet - Carrito</title>
  <link rel="stylesheet" href="lolsito.css">
</head>
<body>

  <header class="navbar">
    <h1>🎁 Regalería Violet</h1>
    <div class="cart-icon-btn">
      🛒 Carrito
      <span class="cart-badge" id="cartCount">0</span>
    </div>
  </header>

  <main class="main-layout">
    <section class="products-section">
      <h2>Catálogo de Productos</h2>
      <div class="products-grid" id="productsGrid"></div>
    </section>

    <aside class="cart-panel">
      <h2>Resumen de Compra</h2>
      <ul class="cart-items" id="cartItems">
        <p class="empty-msg">El carrito está vacío</p>
      </ul>

      <div class="cart-summary">
        <div class="cart-total">
          <span>Total:</span>
          <span id="cartTotal">$0</span>
        </div>
        <button class="checkout-btn" id="checkoutBtn" onclick="sendWhatsAppOrder()">
          Comprar
      
        </button>
      </div>
    </aside>
  </main>

  <script src="main.js"></script>
</body>
</html>
