<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Violet - Carrito de Compras</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <!-- Estilos Propios -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar bg-white py-3 border-bottom sticky-top">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand brand-title d-flex align-items-center gap-2 m-0" href="#">
                <i class="bi bi-flower1"></i> violet
            </a>
            <!-- Botón del Carrito -->
            <button class="btn btn-outline-violet rounded-pill px-3 position-relative" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas">
                <i class="bi bi-bag me-1"></i> Carrito
                <span id="cart-counter" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-violet">0</span>
            </button>
        </div>
    </nav>

    <!-- Catálogo Principal -->
    <main class="container py-5">
        <div class="text-center mb-5">
            <span class="text-uppercase text-violet fw-bold small tracking-wide">Elegí tus favoritos</span>
            <h2 class="font-playfair fw-bold mt-1">Regalos que enamoran[cite: 1]</h2>
        </div>

        <div class="row g-4" id="product-list">
            <!-- Se carga desde script.js -->
        </div>
    </main>

    <!-- Carrito Lateral (Offcanvas) -->
    <div class="offcanvas offcanvas-end rounded-start-4 border-0 shadow" tabindex="-1" id="cartOffcanvas">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title font-playfair fw-bold"><i class="bi bi-bag-heart text-violet me-2"></i> Tu Carrito</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <!-- Listado de ítems del carrito -->
            <div id="cart-items" class="flex-grow-1 overflow-auto pe-1">
                <p class="text-center text-muted my-5">Tu carrito está vacío 🌸</p>
            </div>
            
            <!-- Totales y Acciones -->
            <div class="border-top pt-3 mt-auto">
                <div class="d-flex justify-content-between fs-5 fw-bold mb-3">
                    <span>Total:</span>
                    <span id="cart-total" class="text-violet">$ 0 ARS</span>
                </div>
                <button class="btn btn-violet w-100 py-2 rounded-pill fw-medium mb-2" onclick="realizarCompra()">
                    Comprar ahora <i class="bi bi-arrow-right ms-1"></i>
                </button>
                <button class="btn btn-link text-muted w-100 text-decoration-none small" onclick="vaciarCarrito()">
                    Vaciar carrito
                </button>
            </div>
        </div>
    </div>

    <!-- Modal de Compra Exitosa -->
    <div class="modal fade" id="successModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 text-center p-4">
                <div class="modal-body">
                    <div class="display-3 text-violet mb-3"><i class="bi bi-check-circle-fill"></i></div>
                    <h3 class="font-playfair fw-bold mb-2">¡Compra exitosa!</h3>
                    <p class="text-muted small mb-4">Muchas gracias por elegirnos. ¡Esperamos que disfrutes tu detalle de violet![cite: 1]</p>
                    <button class="btn btn-violet rounded-pill px-4 py-2" data-bs-dismiss="modal">Volver a la tienda</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script Propio -->
    <script src="script.js"></script>
</body>
</html>
